<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <title>Çevrimdışı · Em3Task</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #141414;
        color: #e5e5e5;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 22px; color: #fff; }
      p { margin: 0 0 24px; line-height: 1.5; color: #a3a3a3; }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #46bba2, #2a8577);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/logo.svg" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Em3Task'a ulaşılamıyor. Bağlantınız geri geldiğinde sayfa yeniden açılacak.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
    <script>
      // Bağlantı gelince otomatik yeniden dene
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
