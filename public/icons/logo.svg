<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Em3Task logosu: turkuaz zemin üzerinde üç kollu "E" (Em3) ve yanında
       sarı onay işareti (tamamlanan iş). Kaynak dosya; PNG ikonlar
       scripts/generate-icons.mjs ile buradan üretilir. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fbfa4"/>
      <stop offset="1" stop-color="#145f58"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="50">
    <path d="M312 136 H132 V376 H312" stroke="#ffffff"/>
    <path d="M132 256 H216" stroke="#ffffff"/>
    <path d="M272 270 L308 306 L382 222" stroke="#fcd34d"/>
  </g>
</svg>
